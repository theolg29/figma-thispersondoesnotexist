<style>
  body {
    font-family: Inter, sans-serif;
    margin: 0;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    box-sizing: border-box;
    background-color: var(--figma-color-bg);
    color: var(--figma-color-text);
  }
  .counter {
    margin-bottom: 16px;
    font-size: 14px;
    text-align: center;
  }
  #count {
    font-weight: 600;
  }
  button {
    background-color: var(--figma-color-bg-brand, #0d99ff);
    color: var(--figma-color-text-onbrand, white);
    border: none;
    border-radius: 6px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    width: 100%;
    transition: background-color 0.2s ease;
  }
  button:hover {
    background-color: var(--figma-color-bg-brand-hover, #007be5);
  }
  button:disabled {
    background-color: var(--figma-color-bg-disabled, #e5e5e5);
    color: var(--figma-color-text-disabled, #b3b3b3);
    cursor: not-allowed;
  }
  .source {
    margin-top: 12px;
    font-size: 11px;
    color: var(--figma-color-text-secondary, #b3b3b3);
    text-align: center;
  }
  .source a {
    color: var(--figma-color-text-brand, #0d99ff);
    text-decoration: none;
  }
  .source a:hover {
    text-decoration: underline;
  }
</style>
<div class="counter">
  <span id="count">0</span> frame(s) selected
</div>
<button id="insert-btn" disabled>Insert profile pictures</button>
<div class="source">
  Source: <a href="https://thispersondoesnotexist.com/" target="_blank">thispersondoesnotexist.com</a>
</div>

<script>
  window.onmessage = (event) => {
    const msg = event.data.pluginMessage;
    if (msg.type === 'selection-count') {
      const count = msg.count;
      document.getElementById('count').textContent = count;
      const btn = document.getElementById('insert-btn');
      if (count > 0) {
        btn.disabled = false;
        btn.textContent = count === 1 ? "Insert 1 profile picture" : `Insert ${count} profile pictures`;
      } else {
        btn.disabled = true;
        btn.textContent = "Insert profile pictures";
      }
    }
  };

  document.getElementById('insert-btn').onclick = () => {
    parent.postMessage({ pluginMessage: { type: 'insert-images' } }, '*');
  };
</script>
